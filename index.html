<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie de tableaux</title>
  <meta name="description" content="Galerie de tableaux avec fiches accessibles par QR code." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Accueil galerie">
      <div class="brand-top">
        <div class="brand-title-wrap">
          <p class="brand-title"><span class="brand-galerie">Galerie</span> <span class="brand-name">Charles H Jaillard</span></p>
          <div class="brand-line"></div>
        </div>
        <svg class="brand-sun" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="50" cy="50" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
          <!-- rayons cardinaux longs -->
          <line x1="50" y1="4"  x2="50" y2="26" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="50" y1="74" x2="50" y2="96" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="4"  y1="50" x2="26" y2="50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="74" y1="50" x2="96" y2="50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <!-- rayons diagonaux mi-longs -->
          <line x1="20" y1="20" x2="31" y2="31" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="69" y1="69" x2="80" y2="80" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="80" y1="20" x2="69" y2="31" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="20" y1="80" x2="31" y2="69" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
          <!-- rayons intermédiaires courts irréguliers -->
          <line x1="50" y1="11" x2="50" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(22.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(67.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(112.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(157.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(202.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(247.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(292.5 50 50)"/>
          <line x1="50" y1="11" x2="50" y2="17" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" transform="rotate(337.5 50 50)"/>
        </svg>
      </div>
      <p class="brand-contact">Contact : 06 29 47 08 66</p>
      <p class="brand-contact">cs.jaillard@gmail.com</p>
    </a>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="site-footer">
    <p></p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
