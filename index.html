<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie Charles H Jaillard</title>
  <meta name="description" content="Galerie de tableaux avec fiches accessibles par QR code." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-link aria-label="Accueil galerie">
        <span class="brand-name">Charles H Jaillard</span>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a class="nav-link" href="/" data-link>Accueil</a>
        <a class="nav-link" href="/#gallerySection" data-link>Galerie</a>
        <a class="nav-link" href="/#artiste" data-link>L'Artiste</a>
        <a class="nav-link" href="/#contact" data-link>Contact</a>
      </nav>
      <div class="header-actions">
        <a class="button nav-cta" href="/#gallerySection" data-link>D&eacute;couvrir les &oelig;uvres</a>
        <button type="button" id="mobile-menu-btn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="mobile-menu" hidden>
      <a class="mobile-link" href="/" data-link>Accueil</a>
      <a class="mobile-link" href="/#gallerySection" data-link>Galerie</a>
      <a class="mobile-link" href="/#artiste" data-link>L'Artiste</a>
      <a class="mobile-link" href="/#contact" data-link>Contact</a>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">Galerie <span>.</span> Charles H Jaillard</p>
      <p class="footer-sub">Atelier d'art impressionniste &middot; Le Lavandou, France</p>
      <p class="footer-copy">&copy; 2026 Galerie Charles H Jaillard. Tous droits r&eacute;serv&eacute;s.</p>
    </div>
  </footer>

  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="nom" />
    <input type="email" name="email" />
    <input type="text" name="sujet" />
    <textarea name="message"></textarea>
  </form>

  <div id="toast" class="toast" role="status" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toast-message">Votre message a été transmis à l'artiste.</span>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
